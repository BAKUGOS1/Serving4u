{% extends 'basic.html' %}
{% load static %}
{% block title %}Request Volunteers - HopeBridge NGO Console{% endblock %}

{% block body %}
<!-- Inner Hero Header -->
<section class="py-5" style="background: var(--grad-hero); color: white; position: relative;">
    <div class="hero-backdrop-pattern"></div>
    <div class="container position-relative py-3" style="z-index: 2;">
        <div class="d-flex align-items-center justify-content-between">
            <div>
                <span class="hero-pill-badge mb-2"><i class="fas fa-user-plus text-warning"></i> Quota Management</span>
                <h1 class="text-white font-weight-bold display-5 mb-0" style="font-size: clamp(2rem, 3.5vw, 2.5rem);">
                    Request Volunteer Quota
                </h1>
            </div>
            <a href="/ngoprofile" class="btn-modern btn-modern-outline-white">
                <i class="fas fa-arrow-left mr-1"></i> Back to Dashboard
            </a>
        </div>
    </div>
</section>

<section class="py-5 bg-light">
    <div class="container py-3">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9">
                <div class="form-modern-card p-4 p-md-5">
                    <form action="/reqcansubmit" method="post" id="reqCanForm">
                        {% csrf_token %}

                        <div class="form-group-modern mb-4">
                            <label class="form-label-modern" for="eventname">Select Target Charity Event <span class="text-danger">*</span></label>
                            <div class="input-icon-group">
                                <i class="fas fa-calendar-alt input-icon"></i>
                                <select class="form-select-modern" style="padding-left: 2.75rem;" id="eventname" name="eventname" required>
                                    {% for me in myevents %}
                                        <option value="{{ me.id }}">{{ me.event_name }} ({{ me.event_date }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="form-group-modern mb-4">
                            <label class="form-label-modern" for="canno">Number of Volunteers Required <span class="text-danger">*</span></label>
                            <div class="input-icon-group">
                                <i class="fas fa-users input-icon"></i>
                                <input type="number" class="form-control-modern" name="canno" id="canno" placeholder="e.g., 15" min="1" required>
                            </div>
                        </div>

                        <button type="submit" class="btn-modern btn-modern-primary btn-modern-lg w-100">
                            <i class="fas fa-bullhorn mr-2"></i> Update Volunteer Requirement
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
