{% extends 'basic.html' %}
{% load static %}
{% block title %}Edit NGO Profile - HopeBridge{% endblock %}

{% block body %}
<!-- Inner Hero Header -->
<section class="py-5" style="background: var(--grad-hero); color: white; position: relative;">
    <div class="hero-backdrop-pattern"></div>
    <div class="container position-relative py-3" style="z-index: 2;">
        <div class="d-flex align-items-center justify-content-between">
            <div>
                <span class="hero-pill-badge mb-2"><i class="fas fa-building text-warning"></i> Organization Settings</span>
                <h1 class="text-white font-weight-bold display-5 mb-0" style="font-size: clamp(2rem, 3.5vw, 2.5rem);">
                    Edit NGO Profile
                </h1>
            </div>
            <a href="/ngoprofile" class="btn-modern btn-modern-outline-white">
                <i class="fas fa-arrow-left mr-1"></i> Back to Dashboard
            </a>
        </div>
    </div>
</section>

<section class="py-5 bg-light">
    <div class="container py-3">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="form-modern-card p-4 p-md-5">
                    <form action="/datasave" method="post" id="editNgoForm">
                        {% csrf_token %}

                        <div class="row g-3">
                            <div class="col-md-6 form-group-modern">
                                <label class="form-label-modern" for="name">Organization Name <span class="text-danger">*</span></label>
                                <div class="input-icon-group">
                                    <i class="fas fa-building input-icon"></i>
                                    <input type="text" class="form-control-modern" name="name" id="name" value="{{ user.name }}" required>
                                </div>
                            </div>

                            <div class="col-md-6 form-group-modern">
                                <label class="form-label-modern" for="phone">Primary Admin Contact <span class="text-danger">*</span></label>
                                <div class="input-icon-group">
                                    <i class="fas fa-user-shield input-icon"></i>
                                    <input type="tel" class="form-control-modern" name="phone" id="phone" value="{{ user.phone_no }}" required>
                                </div>
                            </div>

                            <div class="col-md-6 form-group-modern">
                                <label class="form-label-modern" for="website">Official Website URL <span class="text-danger">*</span></label>
                                <div class="input-icon-group">
                                    <i class="fas fa-globe input-icon"></i>
                                    <input type="url" class="form-control-modern" name="website" id="website" value="{{ profiledata.website }}" required>
                                </div>
                            </div>

                            <div class="col-md-6 form-group-modern">
                                <label class="form-label-modern" for="ngophone">Public NGO Helpline Number <span class="text-danger">*</span></label>
                                <div class="input-icon-group">
                                    <i class="fas fa-phone-alt input-icon"></i>
                                    <input type="tel" class="form-control-modern" name="ngophone" id="ngophone" value="{{ profiledata.ngo_helpline }}" required>
                                </div>
                            </div>

                            <div class="col-12 form-group-modern">
                                <label class="form-label-modern" for="address">Physical Headquarters Address <span class="text-danger">*</span></label>
                                <div class="input-icon-group">
                                    <i class="fas fa-map-marker-alt input-icon"></i>
                                    <input type="text" class="form-control-modern" name="address" id="address" value="{{ profiledata.address }}" required>
                                </div>
                            </div>

                            <div class="col-12 form-group-modern">
                                <label class="form-label-modern" for="description">Mission Description & Cause Focus <span class="text-danger">*</span></label>
                                <textarea class="form-control-modern" name="description" id="description" rows="4" required>{{ profiledata.ngo_desc }}</textarea>
                            </div>
                        </div>

                        <button type="submit" class="btn-modern btn-modern-primary btn-modern-lg w-100 mt-4">
                            <i class="fas fa-save mr-2"></i> Save NGO Profile Changes
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
